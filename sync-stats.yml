name: Sync Player Stats

on:
  schedule:
    # Every 2 hours -- covers every season each run, so this is now
    # fully self-healing: if any season is ever missing or incomplete
    # for any reason, the next run (at most 2 hours later) fixes it
    # automatically. Runs on GitHub's infrastructure, not Render's
    # resource-limited free tier, so it can't be interrupted by a
    # container restart mid-job the way the old in-app background
    # thread could be.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually anytime

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Sync every season, one at a time
        run: |
          for year in $(seq 2015 $(date +%Y)); do
            echo "Syncing $year..."
            curl -sS -X POST "https://fantasyfootballcalc.com/api/sync-stats?season=$year&secret=${{ secrets.SITE_PASSWORD }}"
            echo ""
            sleep 3
          done

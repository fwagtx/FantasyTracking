services:
  - type: web
    name: dynasty-league-explorer
    runtime: python
    # MUST match whatever the dashboard actually has selected. A
    # blueprint sync applies this line, so leaving it on a smaller plan
    # than the one being paid for silently downgrades the service --
    # this said "free" while the dashboard was on the 0.5 CPU / 512 MB
    # starter, which is one sync away from taking the instance down a
    # tier without anybody asking for it. Update it on every upgrade.
    plan: starter
    # How Render knows the new instance is actually serving before it
    # sends anyone to it. Without this, a deploy stops the old process
    # and hopes -- which is the gap a visitor sees as Render's own 502
    # page. /healthz is deliberately the cheapest route in the app.
    #
    # On Free this shortens the gap but cannot close it: zero-downtime
    # deploys need a paid instance, where Render boots the new process,
    # waits for this path to pass, and only then moves traffic over.
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gthread --workers=1 --threads=8 --timeout=60 webapp:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLEEPER_USERNAME
        sync: false
      - key: SEASON
        sync: false
      # Mail. Until these are filled in, password-reset emails are not
      # sent: the flow still answers, and the link goes to the log.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Set in the Render dashboard, not here. A value in this file wins
      # over the dashboard whenever a blueprint sync runs, which during a
      # domain move would quietly put the old hostname back into every
      # link the app emails out.
      - key: SITE_URL
        sync: false

services:
  - type: web
    name: dynasty-league-explorer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SLEEPER_USERNAME
        sync: false
      - key: SEASON
        sync: false

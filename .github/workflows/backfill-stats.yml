name: Backfill Player Stats (one-time, all years)

on:
  workflow_dispatch:   # only runs when you click "Run workflow" -- never automatic
    inputs:
      season:
        description: "Single season to backfill (e.g. 2025). Leave blank to backfill every season from 2015 to the current year."
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      HOST: ${{ vars.SITE_HOST || 'https://fantasyfootballcalc.com' }}
      SEASON_INPUT: ${{ github.event.inputs.season }}
    steps:
      - name: Sync every season, one at a time
        run: |
          # See sync-stats.yml: without the response check, a missing
          # secret made this backfill report success in ~30 seconds
          # having synced absolutely nothing.
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set -- this job cannot authenticate."
            exit 1
          fi
          if [ -n "$SEASON_INPUT" ]; then
            years="$SEASON_INPUT"
          else
            years=$(seq 2015 $(date +%Y))
          fi
          failed=""
          for year in $years; do
            echo "Syncing $year..."
            body=$(curl -sS --fail-with-body -X POST \
              -H "X-Sync-Secret: $SITE_PASSWORD" \
              "$HOST/api/sync-stats?season=$year") || body="request failed: $body"
            echo "  $body"
            case "$body" in *'"ok": false'*|*'"ok":false'*|"request failed:"*)
              failed="$failed $year";; esac
            sleep 30
          done
          if [ -n "$failed" ]; then
            echo "::error::these seasons did not sync:$failed"
            exit 1
          fi

name: Memory Check

on:
  workflow_dispatch:
    inputs:
      shed:
        description: "Also drop every cache (type yes) -- the lever to pull if the site is struggling"
        default: "no"

jobs:
  memory-check:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      SHED: ${{ github.event.inputs.shed }}
    steps:
      - name: Ask the live server what it weighs
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set."
            exit 1
          fi
          q=""
          if [ "$SHED" = "yes" ]; then q="?shed=1"; fi
          echo "--- /api/memory$q ---"
          body=$(curl -sS --fail-with-body --max-time 60 \
            -H "X-Sync-Secret: $SITE_PASSWORD" \
            "https://fantasyfootballcalc.com/api/memory$q") || {
              echo "::error::request failed: $body"; exit 1; }
          echo "$body"
          case "$body" in *'"ok": false'*|*'"ok":false'*)
            echo "::error::server rejected the request"; exit 1;; esac
          echo "--- the pages a visitor actually loads ---"
          for path in / /scores /rankings "/rankings?pos=K" /matchup; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
              "https://fantasyfootballcalc.com$path")
            echo "$code  $path"
          done

name: Memory Check

on:
  workflow_dispatch:
    inputs:
      trim:
        description: "Hand the heap back first (type yes) -- costs nothing, keeps every cache"
        default: "no"
      shed:
        description: "Also drop every cache (type yes) -- the heavier lever, makes the next visitor wait for a rebuild"
        default: "no"

jobs:
  memory-check:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      HOST: ${{ vars.SITE_HOST || 'https://fantasyfootballcalc.com' }}
      SHED: ${{ github.event.inputs.shed }}
      TRIM: ${{ github.event.inputs.trim }}
    steps:
      - name: Ask the live server what it weighs
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set."
            exit 1
          fi
          q=""
          sep="?"
          if [ "$TRIM" = "yes" ]; then q="${sep}trim=1"; sep="&"; fi
          if [ "$SHED" = "yes" ]; then q="${q}${sep}shed=1"; fi
          echo "--- /api/memory$q ---"
          body=$(curl -sS --fail-with-body --max-time 60 \
            -H "X-Sync-Secret: $SITE_PASSWORD" \
            "$HOST/api/memory$q") || {
              echo "::error::request failed: $body"; exit 1; }
          echo "$body"
          case "$body" in *'"ok": false'*|*'"ok":false'*)
            echo "::error::server rejected the request"; exit 1;; esac
          echo "--- the pages a visitor actually loads ---"
          for path in / /scores /rankings "/rankings?pos=K" /matchup; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
              "$HOST$path")
            echo "$code  $path"
          done

name: Promo Capture

# Record the live site as video, for posting.
#
# This runs here rather than anywhere else for one reason: a runner has
# real internet. The development sandbox cannot reach streakpros.com, and
# screen-recording a laptop by hand gives you a wobbly clip with a
# notification bar in it. A runner drives production headlessly, at an
# exact size, the same way every time.
#
# Nothing is published. Each run drops .mp4 files into the run's
# artifacts for you to download and post yourself.
on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Comma-separated scene names, or 'all' for every one"
        default: "all"
      shape:
        description: "wide (X/Reddit/YouTube), tall (TikTok/Reels/Shorts), or both"
        default: "both"
      site:
        description: "Which site to record"
        default: "https://streakpros.com"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and ffmpeg
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          # The runner image does not ship ffmpeg, and the conversion
          # step below is useless without it: Playwright records VP8 in
          # a .webm and no social platform takes that.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Record
        env:
          # Optional. Set these as repository secrets to record the
          # signed-in experience; without them the members-only panels
          # record as their locked card, which is honest but dull.
          # The password belongs in the secret and nowhere else.
          PROMO_EMAIL: ${{ secrets.PROMO_EMAIL }}
          PROMO_PASSWORD: ${{ secrets.PROMO_PASSWORD }}
          SITE: ${{ github.event.inputs.site || 'https://streakpros.com' }}
          SCENES: ${{ github.event.inputs.scenes || 'montage' }}
          SHAPE: ${{ github.event.inputs.shape || 'both' }}
        run: |
          set -u
          missed=0
          miss_list=""
          mkdir -p promo
          case "$SHAPE" in
            both) shapes="wide tall" ;;
            *)    shapes="$SHAPE" ;;
          esac
          echo "## Clips" >> $GITHUB_STEP_SUMMARY
          if [ "$SCENES" = "all" ]; then
            SCENES=$(python3 -c "import sys; sys.path.insert(0,'scripts'); import promo_capture as p; print(','.join(sorted(p.SCENES)))")
            echo "recording every scene: $SCENES"
          fi
          for scene in $(echo "$SCENES" | tr ',' ' '); do
            for shape in $shapes; do
              echo "--- recording $scene ($shape)"
              # One bad scene must not cost you the others in the run.
              # Exit 2 means the clip recorded but a beat did not land
              # -- worth reading the log before posting it. Anything
              # else means there is no clip at all.
              set +e
              python3 scripts/promo_capture.py \
                --base "$SITE" --scene "$scene" --shape "$shape" --out promo
              code=$?
              set -e
              case "$code" in
                0) echo "RECORDED - $scene ($shape)" >> $GITHUB_STEP_SUMMARY ;;
                2) echo "RECORDED WITH MISSED BEATS - $scene ($shape), see the log" >> $GITHUB_STEP_SUMMARY
                   missed=1
                   miss_list="${miss_list}${miss_list:+, }$scene ($shape)" ;;
                *) echo "FAILED - $scene ($shape)" >> $GITHUB_STEP_SUMMARY ;;
              esac
            done
          done
          ls -la promo
          # One line naming every clip with a missed beat, printed last so
          # a short tail of the log answers "which ones?" without reading
          # the whole recording transcript.
          echo
          if [ "$missed" = "0" ]; then
            echo "=== every clip landed every beat ==="
          else
            echo "=== clips with a missed beat: $miss_list ==="
            echo "PROMO_MISSED=1" >> $GITHUB_ENV
          fi

      - name: Convert to mp4
        run: |
          set -u
          # Playwright writes VP8 in a .webm. Every platform wants H.264
          # in an .mp4, yuv420p, with the index at the front so it starts
          # playing before it has finished downloading.
          for f in promo/*.webm; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .webm)
            case "$name" in
              # Recorded at 540x960 so the page renders its real phone
              # layout; doubled here to exactly 1080x1920 -- TikTok,
              # Reels and Shorts.
              *-tall) scale="1080:1920" ;;
              # Recorded at 1920x1080 already -- YouTube and X.
              *)      scale="1920:1080" ;;
            esac
            # H.264 High in an .mp4, yuv420p (the only chroma TikTok
            # reliably accepts), a fixed 30fps and the index at the
            # front. The silent AAC track is not padding: a file with no
            # audio stream at all is the most common reason a TikTok or
            # Reels upload is rejected outright.
            ffmpeg -y -loglevel error -i "$f" \
              -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
              -vf "fps=30,scale=$scale:flags=lanczos,format=yuv420p" \
              -c:v libx264 -profile:v high -level 4.1 -preset medium -crf 20 \
              -c:a aac -b:a 128k -shortest \
              -movflags +faststart "promo/$name.mp4"
            # A still from a second in, for a thumbnail or a post image.
            ffmpeg -y -loglevel error -ss 1 -i "promo/$name.mp4" \
              -frames:v 1 -q:v 2 "promo/$name.jpg"
            rm -f "$f"
            printf '  %-22s %s\n' "$name.mp4" "$(du -h "promo/$name.mp4" | cut -f1)"
          done
          ls -la promo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-clips
          path: promo/
          retention-days: 30

      # Trusting the ffmpeg flags is not the same as checking the file
      # they produced. A clip a pixel off, missing its audio stream, or
      # under three seconds gets rejected at upload time, which is the
      # worst possible place to find out.
      - name: Check every clip is postable
        run: |
          set -u
          bad=0
          for f in promo/*.mp4; do
            [ -e "$f" ] || continue
            w=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f")
            h=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")
            fr=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$f")
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            aud=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f" || true)
            case "$f" in
              *-tall.mp4) want="1080x1920" ;;
              *)          want="1920x1080" ;;
            esac
            got="${w}x${h}"
            ok=1
            [ "$got" = "$want" ] || { echo "FAIL $f: $got, wanted $want"; ok=0; }
            [ "$fr" = "30/1" ] || { echo "FAIL $f: $fr fps, wanted 30/1"; ok=0; }
            [ -n "$aud" ] || { echo "FAIL $f: no audio stream"; ok=0; }
            awk -v d="$dur" 'BEGIN{ exit !(d+0 >= 3) }' || { echo "FAIL $f: ${dur}s is under the 3s minimum"; ok=0; }
            if [ "$ok" = "1" ]; then
              echo "OK   $(basename $f)  $got  30fps  ${dur%.*}s  audio:$aud"
              echo "POSTABLE - $(basename $f), $got, ${dur%.*}s" >> $GITHUB_STEP_SUMMARY
            else
              bad=1
            fi
          done
          [ "$bad" = "0" ] || { echo "Some clips are not postable."; exit 1; }

      # Last, so the clips are always uploaded first and you can still
      # watch what did record. A red run here means "a beat aimed at
      # something that was not on the page" -- which is the failure that
      # used to be invisible, because the clip still came out looking
      # plausible.
      - name: A missed beat fails the run
        if: env.PROMO_MISSED == '1'
        run: |
          echo "One or more beats did not land. The clips are in the"
          echo "artifact; read the Record step's log for which ones."
          exit 1

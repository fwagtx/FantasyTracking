name: Sync NFL Schedule

on:
  schedule:
    # Every 2 hours -- same cadence as sync-stats.yml. Keeps kickoff
    # times, live scores, and final scores in nfl_schedule current for
    # the calendar/scoreboard pages and for matchup-grade opponent
    # lookups.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to sync (e.g. 2025). Leave blank for the current season."
        required: false
        type: string

jobs:
  sync-schedule:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      EVENT_NAME: ${{ github.event_name }}
      SEASON_INPUT: ${{ github.event.inputs.season }}
    steps:
      - name: Sync the schedule
        run: |
          # See sync-stats.yml for why the response body is checked: a
          # missing secret made this job report success while the server
          # returned "unauthorized" every single run.
          # A scheduled run with no secret has nothing to authenticate
          # with and nothing useful to do. It exits GREEN rather than red:
          # this fired every half hour for days, mailing a failure notice
          # each time, for a condition no re-run can fix and that only the
          # repository owner can change. The notice below still says so on
          # the run itself, so it is skipped visibly rather than silently.
          #
          # Nothing breaks while it skips. Every season this job seeds is
          # also seeded on demand by the app itself (see
          # ensure_season_stats_synced / ensure_schedule_synced), so the
          # secret makes the work happen on a schedule instead of on a
          # visitor's first page load -- it is an optimisation, not a
          # dependency.
          if [ -z "$SITE_PASSWORD" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::notice::SITE_PASSWORD is not set, so this scheduled run has nothing to authenticate with -- skipping. Set the repository secret to turn this job back on."
              exit 0
            fi
            # Somebody pressed Run workflow. They want it to run, so say
            # plainly why it cannot.
            echo "::error::SITE_PASSWORD repository secret is not set -- this job cannot authenticate."
            exit 1
          fi
          # The recurring cron only ever syncs the current season, so a
          # prior season (which matchup grading needs for its
          # defense-vs-position history) has no automatic path in here.
          # This input is how one gets backfilled on demand.
          url="https://fantasyfootballcalc.com/api/sync-schedule"
          if [ -n "$SEASON_INPUT" ]; then
            url="$url?season=$SEASON_INPUT"
          fi
          body=$(curl -sS --fail-with-body -X POST \
            -H "X-Sync-Secret: $SITE_PASSWORD" "$url") || {
              echo "::error::sync-schedule request failed: $body"; exit 1; }
          echo "$body"
          case "$body" in *'"ok": false'*|*'"ok":false'*)
            echo "::error::server rejected the sync: $body"; exit 1;; esac

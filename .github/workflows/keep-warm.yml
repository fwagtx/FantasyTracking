name: Warm Caches

on:
  schedule:
    # Every 30 minutes. This used to run every 12 minutes to stay under
    # Render's free-tier ~15-minute spin-down, but the service is on a
    # paid always-on instance now, so there is no container to keep
    # awake and no cold boot to outrun -- GitHub's scheduler was never
    # reliable enough for that job anyway (it routinely fires 10-30
    # minutes late under load).
    #
    # What's left is genuinely useful and is why this file still exists:
    # /api/warm rebuilds the in-memory caches that a deploy or a process
    # restart empties, and it seeds any season the deepened matchup
    # history needs but nobody has synced yet -- so that discovery
    # happens here instead of on a real visitor's page load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Refresh caches and seed historical seasons
        run: |
          # See sync-stats.yml: this step reported success on every run
          # for months while the server answered "unauthorized", which is
          # why the caches it is supposed to warm were always cold.
          # A scheduled run with no secret has nothing to authenticate
          # with and nothing useful to do. It exits GREEN rather than red:
          # this fired every half hour for days, mailing a failure notice
          # each time, for a condition no re-run can fix and that only the
          # repository owner can change. The notice below still says so on
          # the run itself, so it is skipped visibly rather than silently.
          #
          # Nothing breaks while it skips. Every season this job seeds is
          # also seeded on demand by the app itself (see
          # ensure_season_stats_synced / ensure_schedule_synced), so the
          # secret makes the work happen on a schedule instead of on a
          # visitor's first page load -- it is an optimisation, not a
          # dependency.
          if [ -z "$SITE_PASSWORD" ]; then
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::notice::SITE_PASSWORD is not set, so this scheduled run has nothing to authenticate with -- skipping. Set the repository secret to turn this job back on."
              exit 0
            fi
            # Somebody pressed Run workflow. They want it to run, so say
            # plainly why it cannot.
            echo "::error::SITE_PASSWORD repository secret is not set -- this job cannot authenticate."
            exit 1
          fi
          body=$(curl -sS --fail-with-body -X POST \
            -H "X-Sync-Secret: $SITE_PASSWORD" \
            "https://fantasyfootballcalc.com/api/warm") || {
              echo "::error::warm request failed: $body"; exit 1; }
          echo "$body"
          case "$body" in *'"ok": false'*|*'"ok":false'*)
            echo "::error::server rejected the warm call: $body"; exit 1;; esac

name: Warm Caches

on:
  schedule:
    # Every 30 minutes. This used to run every 12 minutes to stay under
    # Render's free-tier ~15-minute spin-down, but the service is on a
    # paid always-on instance now, so there is no container to keep
    # awake and no cold boot to outrun -- GitHub's scheduler was never
    # reliable enough for that job anyway (it routinely fires 10-30
    # minutes late under load).
    #
    # What's left is genuinely useful and is why this file still exists:
    # /api/warm rebuilds the in-memory caches that a deploy or a process
    # restart empties, and it seeds any season the deepened matchup
    # history needs but nobody has synced yet -- so that discovery
    # happens here instead of on a real visitor's page load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - name: Refresh caches and seed historical seasons
        run: |
          # See sync-stats.yml: this step reported success on every run
          # for months while the server answered "unauthorized", which is
          # why the caches it is supposed to warm were always cold.
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set -- the warm step cannot authenticate."
            exit 1
          fi
          body=$(curl -sS --fail-with-body -X POST \
            -H "X-Sync-Secret: $SITE_PASSWORD" \
            "https://fantasyfootballcalc.com/api/warm") || {
              echo "::error::warm request failed: $body"; exit 1; }
          echo "$body"
          case "$body" in *'"ok": false'*|*'"ok":false'*)
            echo "::error::server rejected the warm call: $body"; exit 1;; esac

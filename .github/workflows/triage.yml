name: Triage

# Is the whole site actually working, right now, from a machine that can
# reach it.
#
# The development sandbox cannot reach the site, and the owner's browser
# is signed in -- which sends a request down a different code path
# entirely, so "it works for me" and "it works" are not the same claim
# until something anonymous checks. This is that something.
#
# Three questions:
#   1. Does every public page answer, and answer with a page rather than
#      the error card?
#   2. Is the database there, and does it hold the seasons the site
#      needs?
#   3. Are the icons and manifest -- the things a phone and a link
#      preview ask for -- being served?
#
# Read-only. Nothing here changes a thing on the server.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to check"
        default: "https://streakpros.com"

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      HOST: ${{ github.event.inputs.site || 'https://streakpros.com' }}
    steps:
      - name: Every public page
        run: |
          echo "## Pages" >> $GITHUB_STEP_SUMMARY
          bad=0
          # Pages that take a query string are listed bare on purpose:
          # landing on one with no argument is what a stray link does,
          # and it has to answer rather than crash.
          for p in / /scores /standings /performances /rankings /kickers-dst \
                   /streaks "/streaks/player" /matchups /injuries /moves \
                   /birthdays /draft /mock-drafts /trade-calculator \
                   /start-bench-cut /player /team /game /performance /play \
                   /plus /pricing /privacy /terms /support /contact \
                   /login /signup /forgot-password /healthz; do
            code=$(curl -sS -o /tmp/b -w '%{http_code}' --max-time 40 "$HOST$p" || echo "000")
            size=$(wc -c < /tmp/b | tr -d ' ')
            note=""
            # Match the error card's own heading, not the words
            # anywhere on the page: /matchups ships a JavaScript string
            # reading "Something went wrong comparing these players.",
            # and a loose grep calls that a broken page forever.
            if grep -q "Something went wrong</h1>" /tmp/b 2>/dev/null \
               || [ "$(cat /tmp/b)" = "Something went wrong. Please try again." ]; then
              note="  <- ERROR CARD"; bad=$((bad+1))
            fi
            case "$code" in
              200|302|301) ;;
              # These two need a valid argument and answer 404 without
              # one, which is correct behaviour rather than a fault.
              404) case "$p" in
                     /player|/play) note="$note  (404 without an argument -- expected)" ;;
                     *) note="$note  <- BAD STATUS"; bad=$((bad+1)) ;;
                   esac ;;
              *) note="$note  <- BAD STATUS"; bad=$((bad+1)) ;;
            esac
            printf '%-20s %s  %8sB%s\n' "$p" "$code" "$size" "$note" \
              | tee -a $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$bad" -gt 0 ]; then
            echo "**$bad page(s) need attention**" | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "**every page answered**" | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Icons, manifest and robots
        run: |
          echo "## Assets" >> $GITHUB_STEP_SUMMARY
          for p in /favicon.ico /favicon.svg /favicon-32.png /icon-192.png \
                   /icon-512.png /apple-touch-icon.png /site.webmanifest; do
            code=$(curl -sS -o /tmp/a -w '%{http_code}' --max-time 20 "$HOST$p" || echo "000")
            size=$(wc -c < /tmp/a | tr -d ' ')
            printf '%-26s %s  %7sB\n' "$p" "$code" "$size" | tee -a $GITHUB_STEP_SUMMARY
          done

      - name: The database, and what is in it
        run: |
          echo "## Database" >> $GITHUB_STEP_SUMMARY
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set."
            exit 1
          fi
          # The secret rides in a header: a query string ends up in
          # access logs, proxy logs and referrers, and a header does
          # not. --fail-with-body keeps the payload on an error status
          # instead of swallowing the one thing worth reading.
          body=$(curl -sS --fail-with-body --max-time 60 \
                   -H "X-Sync-Secret: $SITE_PASSWORD" \
                   "$HOST/api/streaks-status") || true
          [ -n "$body" ] || body='{}'
          echo "$body" | head -c 1500
          echo
          if ! echo "$body" | jq -e . >/dev/null 2>&1; then
            echo "UNREADABLE - that was not JSON, so the app itself is failing" \
              | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if echo "$body" | tr -d ' ' | grep -q '"ok":false'; then
            echo "SERVER SAID NO - $(echo "$body" | jq -r '.error // "no reason given"')" \
              | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          err=$(echo "$body" | jq -r '.db_error // empty')
          if [ -n "$err" ]; then
            echo "DATABASE REFUSED THE CONNECTION:" | tee -a $GITHUB_STEP_SUMMARY
            echo "  $err" | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "connected: $(echo "$body" | jq -r '.database')" | tee -a $GITHUB_STEP_SUMMARY
          echo "season/week: $(echo "$body" | jq -r '.season')/$(echo "$body" | jq -r '.week')" \
            | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| season | rows | with stats |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "$body" | jq -r '.seasons | to_entries[]
            | "| \(.key) | \(.value.rows) | \(.value.with_stats) |"' \
            | tee -a $GITHUB_STEP_SUMMARY
          n=$(echo "$body" | jq -r '.seasons | length')
          [ "$n" = "0" ] && echo "NO SEASONS STORED - the site has no history to work from" \
            | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "starters listed: $(echo "$body" | jq -c '.starters')" \
            | tee -a $GITHUB_STEP_SUMMARY

      - name: Rating Draft -- is one open right now
        run: |
          echo "## Rating Draft" >> $GITHUB_STEP_SUMMARY
          # The whole opening rule reads nfl_schedule, so this is the
          # only check that proves it end to end: ask production which
          # draft it thinks is open, and then ask that day about itself.
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set."
            exit 1
          fi
          info=$(curl -sS --fail-with-body --max-time 60 \
                   -H "X-Sync-Secret: $SITE_PASSWORD" \
                   "$HOST/api/streaks-status") || info='{}'
          if echo "$info" | tr -d ' ' | grep -q '"ok":false'; then
            echo "SERVER SAID NO - $(echo "$info" | jq -r '.error // "no reason given"')" \
              | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          season=$(echo "$info" | jq -r '.season // empty')
          week=$(echo "$info" | jq -r '.week // empty')
          today=$(TZ=America/New_York date +%F)
          echo "season $season, week $week, Eastern today $today" | tee -a $GITHUB_STEP_SUMMARY
          if [ -z "$season" ] || [ -z "$week" ]; then
            echo "could not read the season -- see the Database step above" | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          probe=$(curl -sS --max-time 60 "$HOST/api/draft?pool=0&day=$today&season=$season&week=$week") || probe='{}'
          # open_day only exists in the build that carries the new rule,
          # so its absence means the deploy has not landed rather than
          # that nothing is open.
          if ! echo "$probe" | jq -e 'has("open_day")' >/dev/null 2>&1; then
            echo "OLD BUILD -- the opening rule is not deployed yet" | tee -a $GITHUB_STEP_SUMMARY
            echo "$probe" | head -c 400; exit 0
          fi
          open=$(echo "$probe" | jq -r '.open_day // empty')
          kick=$(echo "$probe" | jq -r '.open_kickoff // empty')
          if [ -z "$open" ]; then
            echo "NOTHING OPEN -- a slate is being played, or the schedule has no next day" \
              | tee -a $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "open day: **$open**, first kickoff $kick" | tee -a $GITHUB_STEP_SUMMARY
          # That day's own payload. Its week may not be this week near a
          # boundary, so try the neighbours before believing "none".
          for wk in "$week" "$((week+1))" "$((week-1))"; do
            [ "$wk" -ge 1 ] || continue
            day=$(curl -sS --max-time 90 "$HOST/api/draft?day=$open&season=$season&week=$wk") || day='{}'
            st=$(echo "$day" | jq -r '.state // "none"')
            [ "$st" = "none" ] || break
          done
          opens=$(echo "$day" | jq -r '.opens_at // empty')
          pool=$(echo "$day" | jq -r '(.pool // []) | length')
          local_open=$(TZ=America/New_York date -d "$opens" '+%A %b %-d, %H:%M' 2>/dev/null || echo "$opens")
          echo "state: **$st**, pool: $pool players" | tee -a $GITHUB_STEP_SUMMARY
          echo "opened: $local_open Eastern" | tee -a $GITHUB_STEP_SUMMARY
          hhmm=$(TZ=America/New_York date -d "$opens" +%H:%M 2>/dev/null || echo "??")
          [ "$hhmm" = "00:00" ] \
            && echo "OPENS AT MIDNIGHT EASTERN - as intended" | tee -a $GITHUB_STEP_SUMMARY \
            || echo "NOT MIDNIGHT EASTERN - it opens at $hhmm" | tee -a $GITHUB_STEP_SUMMARY
          [ "$st" = "open" ] && [ "$pool" -gt 0 ] \
            && echo "ENTERABLE NOW - $pool players to pick from" | tee -a $GITHUB_STEP_SUMMARY \
            || echo "NOT ENTERABLE - state $st with $pool players" | tee -a $GITHUB_STEP_SUMMARY
          # And the other half: the panel must render nothing on a day
          # whose draft has not opened.
          html=$(curl -sS --max-time 60 "$HOST/scores") || html=""
          case "$html" in
            *".sc-draft:empty"*) echo "the panel collapses on days with no draft" | tee -a $GITHUB_STEP_SUMMARY ;;
            *) echo "MISSING - the empty-panel rule is not in the served page" | tee -a $GITHUB_STEP_SUMMARY ;;
          esac
          case "$html" in
            *"dot draft"*) echo "the strip can mark the open day" | tee -a $GITHUB_STEP_SUMMARY ;;
            *) echo "MISSING - the open-day marker is not in the served page" | tee -a $GITHUB_STEP_SUMMARY ;;
          esac

      - name: Is the schedule loaded
        run: |
          echo "## Schedule" >> $GITHUB_STEP_SUMMARY
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set."
            exit 1
          fi
          body=$(curl -sS --fail-with-body --max-time 60 \
                   -H "X-Sync-Secret: $SITE_PASSWORD" \
                   "$HOST/api/schedule-status") || true
          [ -n "$body" ] || body='{}'
          echo "$body" | head -c 1200
          echo
          if echo "$body" | tr -d ' ' | grep -q '"ok":false'; then
            echo "SERVER SAID NO - $(echo "$body" | jq -r '.error // "no reason"')" \
              | tee -a $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$body" | jq -r '.' 2>/dev/null | head -40 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

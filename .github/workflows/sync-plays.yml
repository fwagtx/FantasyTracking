name: Sync Play-by-Play (EPA)

on:
  schedule:
    # Monday and Tuesday mornings UTC. nflverse publishes after games
    # finish rather than during them, so there is nothing to collect
    # mid-slate -- this picks up the weekend once it is complete, and
    # again a day later for the Monday night game.
    - cron: "0 9 * * 1,2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to sync (e.g. 2025). Leave blank for the current season."
        required: false
        type: string

jobs:
  sync-plays:
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      SEASON_INPUT: ${{ github.event.inputs.season }}
    steps:
      - name: Sync play-by-play
        run: |
          # See sync-stats.yml for why the response body is checked rather
          # than trusting curl's exit code.
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD repository secret is not set -- this job cannot authenticate."
            exit 1
          fi
          url="https://fantasyfootballcalc.com/api/sync-plays"
          if [ -n "$SEASON_INPUT" ]; then
            url="$url?season=$SEASON_INPUT"
          fi
          body=$(curl -sS --fail-with-body -X POST \
            -H "X-Sync-Secret: $SITE_PASSWORD" "$url") || {
              echo "::error::sync-plays request failed: $body"; exit 1; }
          echo "$body"
          case "$body" in *'"ok": false'*|*'"ok":false'*)
            echo "::error::server rejected the sync: $body"; exit 1;; esac

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- LA TIENDITA BAD covers and thumbnails (auto/thumbs.py writes the spec, thumb.mjs takes the screenshot).
     Owner, 2026-11-18, three rounds: the frame covers "look so ai"; the first designed ones "give off very aish" (rays,
     sticker outlines, tilted text, marker notes); the in-game-tile ones "still look ai from the coloring" (flat saturated
     gradients and colour blocks). So: no designed colour at all. The background is the cover's own art (the skin render or
     the map) blown up, blurred and darkened, graded down and given film grain, so all colour comes from Epic's art and falls
     off naturally; strips and banners are near-black; one muted accent. The code sits small under the headline
     ("Código de creador: BAD", owner: "promote our code in the thumbnail but make it subtle"), never next to a price. -->
<style>
  @font-face { font-family: "BC"; font-weight: 900; src: url(../../_shared/fonts/BarlowCondensed-Black.ttf); font-display: block; }
  @font-face { font-family: "BC"; font-weight: 800; src: url(../../_shared/fonts/BarlowCondensed-ExtraBold.ttf); font-display: block; }
  :root { --acc: #f0c64a; --ink: #0c0c0e; }
  html, body { margin: 0; padding: 0; background: #000; }
  #s { position: relative; overflow: hidden; background: #0c0c0e; }
  .fill { position: absolute; inset: 0; }
  img { position: absolute; display: block; }
  .h { position: absolute; font-family: "BC"; font-weight: 900; text-transform: uppercase; line-height: .88; color: #f4f4f2; letter-spacing: -.005em; }
  .h .l { display: block; width: max-content; -webkit-text-stroke: var(--sw, 6px) rgba(6,6,8,.9); paint-order: stroke fill; text-shadow: 0 8px 26px rgba(0,0,0,.55); }
  .h.c .l { margin: 0 auto; }
  .h.r .l { margin-left: auto; }
  .y { color: var(--acc); }
  .ban { position: absolute; transform: skewX(-12deg); background: rgba(10,10,12,.86); padding: 9px 24px 5px; border-left: 6px solid var(--acc); }
  .ban span { display: block; transform: skewX(12deg); font-family: "BC"; font-weight: 900; text-transform: uppercase; color: #f4f4f2; line-height: 1; white-space: nowrap; }
  .strip { position: absolute; left: 0; right: 0; padding: 24px 64px 0; background: rgba(10,10,12,.9); }
  .strip .n { font-family: "BC"; font-weight: 800; text-transform: uppercase; color: #f4f4f2; line-height: 1; white-space: nowrap; width: max-content; }
  .strip .p { display: flex; align-items: center; gap: 16px; margin-top: 12px; font-family: "BC"; font-weight: 900; color: #f4f4f2; line-height: 1; }
  .strip .p img { position: static; }
  .strip .p s { color: rgba(244,244,242,.5); text-decoration-thickness: .08em; font-weight: 800; }
  .code { display: flex; align-items: center; gap: 12px; margin-top: 22px; font-family: "BC"; font-weight: 800; color: rgba(244,244,242,.78); letter-spacing: .02em; white-space: nowrap; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .code b { background: var(--acc); color: #111; padding: 3px 12px 1px; font-weight: 900; letter-spacing: .03em; text-shadow: none; }
  .brand { position: absolute; font-family: "BC"; font-weight: 800; color: rgba(244,244,242,.88); letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; }
</style>
</head>
<body>
<div id="s"></div>
<script>
const S = window.SPEC, W = S.w, H = S.h;
const st = document.getElementById("s");
st.style.width = W + "px"; st.style.height = H + "px";
const fits = [];
const PAD = W > H ? 56 : 64;

function el(cls, css, html, parent = st) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  if (css) d.style.cssText = css;
  if (html != null) d.innerHTML = html;
  parent.appendChild(d);
  return d;
}
function pic(src, css, parent = st) {
  const i = document.createElement("img");
  i.src = src; i.style.cssText = css;
  parent.appendChild(i);
  return i;
}
// headline; with code=true the creator code sits small right under it (never near a price)
function head(lines, css, opts = {}) {
  const box = el("h" + (opts.align ? " " + opts.align : ""), css);
  for (const L of lines) {
    const s = document.createElement("span");
    s.className = "l" + (L.y ? " y" : ""); s.textContent = L.t; s.style.fontSize = L.size + "px";
    if (L.sw) s.style.setProperty("--sw", L.sw + "px");
    box.appendChild(s);
    if (L.max) fits.push([s, L.max]);
  }
  if (opts.code) code(box, opts.code);
  return box;
}
function code(parent, size) {
  return el("code", `font-size:${size}px;text-transform:none`, `Código de creador <b>BAD</b>`, parent);
}
function codeTop() { const c = el("code", `position:absolute;left:${PAD}px;top:246px;margin:0;font-size:38px;text-transform:none`, `Código de creador <b>BAD</b>`); return c; }
function banner(text, size, css) { return el("ban", css, `<span style="font-size:${size}px">${text}</span>`); }
const fmt = (n) => Number(n).toLocaleString("en-US");
function marks() {
  if (S.disc === false) return;
  const sz = W > H ? 24 : 34, top = W > H ? 22 : 64;
  el("brand", `left:${PAD}px;top:${top}px;font-size:${sz}px`, "#EpicPartner");
  el("brand", `right:${PAD}px;top:${top}px;font-size:${sz}px`, "LA TIENDITA BAD");
}

// the background is the art itself, blown up, blurred and darkened: no designed colour
function artBg(src, x, y, size, bright = .56) {
  pic(src, `width:${size}px;height:${size}px;left:${x}px;top:${y}px;filter:blur(${Math.round(size / 40)}px) brightness(${bright}) saturate(.8) contrast(1.06)`);
}
function grade(top = .38, bottom = .62) {
  el("fill", `background: linear-gradient(180deg, rgba(0,0,0,${top}) 0%, rgba(0,0,0,.06) 46%, rgba(0,0,0,${bottom}) 100%)`);
  el("fill", "background: radial-gradient(ellipse 78% 64% at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,.5) 100%)");
}
function grain(op = .09) {
  el("fill", `opacity:${op};mix-blend-mode:overlay`, `<svg width="${W}" height="${H}"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>`);
}
function hero(src, size, x, y) {
  return pic(src, `width:${size}px;height:${size}px;left:${x}px;top:${y}px;filter:drop-shadow(0 30px 46px rgba(0,0,0,.6)) saturate(.94)`);
}
function strip(name, price, regular, top, save, extra) {
  const s = el("strip", `top:${top}px;bottom:0`);
  const n = el("n", "font-size:60px", name, s);
  fits.push([n, W - 2 * PAD]);
  if (price != null) {
    el("p", "font-size:96px", `<img src="${S.vbuck}" style="width:86px;height:86px">${price}${regular ? ` <s style="font-size:62px;margin-left:8px">${regular}</s>` : ""}`, s);
  }
  if (extra) el("p", "font-size:84px", extra, s);
  if (save) banner(save, 46, `right:${PAD + 8}px;top:${top + 112}px`);
  return s;
}
function circle(cx, cy, r) {
  el("", `position:absolute;left:${cx - r * 1.12}px;top:${cy - r * .92}px;width:${r * 2.24}px;height:${r * 1.84}px;border:12px solid #e23a32;border-radius:50%;transform:rotate(-8deg);box-sizing:border-box;box-shadow:0 2px 8px rgba(0,0,0,.35)`);
}

const L = {};

L.drop = () => {              // "Se va hoy": the bundle leaving today
  artBg(S.hero, -900, -300, 2900);
  grade();
  hero(S.hero, 1180, -50, 600);
  grain();
  codeTop();
  head([{ t: "SE VA", size: 222 }, { t: "HOY", size: 320, y: true }], `left:${PAD}px;top:306px`);
  banner(S.when, 54, `right:${PAD + 10}px;top:350px`);
  strip(S.name, fmt(S.final), S.regular ? fmt(S.regular) : "", 1418);
  marks();
};

L.top = () => {               // the #1 of today's new listings; the price stays hidden (the video counts it up)
  artBg(S.hero, -900, -300, 2900);
  grade();
  hero(S.hero, 1240, -80, 520);
  grain();
  codeTop();
  head(S.lines.map((t, i) => ({ t, size: 176, y: i === S.lines.length - 1, max: 700 })), `left:${PAD}px;top:306px`);
  banner("#1", 140, `right:${PAD + 14}px;top:316px;padding:10px 30px 2px`);
  strip(S.name, "?????", "", 1418);
  marks();
};

L.shop = () => {              // today's shop: the deal's listing
  artBg(S.hero, -900, -300, 2900);
  grade();
  hero(S.hero, 1240, -80, 520);
  grain();
  codeTop();
  head([{ t: "TIENDA", size: 214 }, { t: "DE HOY", size: 214, y: true }], `left:${PAD}px;top:306px`);
  banner(S.date, 80, `right:${PAD + 10}px;top:330px`);
  strip(S.name, S.final != null ? fmt(S.final) : null, S.regular ? fmt(S.regular) : "", 1418, S.tag);
  marks();
};

L.guess = () => {             // "¿De qué temporada?": the season left blank
  artBg(S.hero, -900, -300, 2900);
  grade();
  hero(S.hero, 1500, -210, 440);
  grain();
  codeTop();
  head([{ t: "¿DE QUÉ", size: 186 }, { t: "TEMPORADA?", size: 210, y: true, max: W - 2 * PAD }], `left:${PAD}px;top:306px`);
  banner("3 SKINS · SIN TRAMPA", 48, `right:${PAD + 8}px;top:1310px`);
  strip(S.name, null, null, 1418, null, "CAPÍTULO ? · TEMPORADA ?");
  marks();
};

L.map = () => {               // "¿Dónde está?": the official map, one red circle
  const cx = 540, cy = 1130, z = S.z || 2.5, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${cx - S.x * z}px;top:${cy - S.y * z}px;filter:saturate(.82) brightness(.92) contrast(1.06)`);
  el("fill", "background: linear-gradient(180deg, rgba(0,0,0,.82) 0px, rgba(0,0,0,.6) 560px, rgba(0,0,0,0) 820px)");
  grade(0, .5);
  circle(cx, cy, 132);
  grain(.08);
  codeTop();
  head([{ t: "¿DÓNDE ESTÁ", size: 128 }, ...S.lines.map((t) => ({ t, size: 190, y: true, max: W - 2 * PAD }))], `left:${PAD}px;top:306px`);
  marks();
};

L.guide = () => {             // the countdown, over the island
  const z = 1.2, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${540 - S.cx * z}px;top:${980 - S.cy * z}px;filter:saturate(.6) brightness(.48) contrast(1.05) blur(2px)`);
  grade(.4, .7);
  grain(.1);
  banner(S.kicker, 64, `left:${PAD + 8}px;top:250px`);
  if (S.top) head([{ t: S.top, size: 170 }], `left:${PAD}px;top:390px`);
  head([{ t: S.big, size: 760, sw: 9, max: W - 2 * PAD }], `left:${PAD - 10}px;top:520px`);
  head([{ t: S.bottom, size: 230, y: true }, ...(S.note ? [{ t: S.note, size: 84 }] : [])], `left:${PAD}px;top:1200px`, { code: 40 });
  marks();
};

L.news = () => {
  const z = 1.1, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${540 - S.cx * z}px;top:${1000 - S.cy * z}px;filter:saturate(.6) brightness(.48) contrast(1.05) blur(2px)`);
  grade(.4, .7);
  grain(.1);
  banner(S.kicker, 60, `left:${PAD + 8}px;top:250px`);
  head([...S.lines.map((t, i) => ({ t, size: 200, y: i % 2 === 1, max: W - 2 * PAD })), ...(S.note ? [{ t: S.note, size: 80, max: W - 2 * PAD }] : [])], `left:${PAD}px;top:400px`, { code: 40 });
  marks();
};

// ---------- YouTube (1280x720) ----------
L.ytmap = () => {
  const z = S.z || .62, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${830 - S.cx * z}px;top:${370 - S.cy * z}px;filter:saturate(.82) brightness(.9) contrast(1.06)`);
  el("fill", "background: linear-gradient(90deg, rgba(0,0,0,.9) 0%, rgba(0,0,0,.72) 40%, rgba(0,0,0,0) 66%)");
  grade(.2, .45);
  grain(.08);
  if (S.big) head([{ t: S.big, size: S.bigSize || 520, sw: 8 }], `right:${S.bigRight ?? 70}px;top:${S.bigTop ?? 40}px`, { align: "r" });
  if (S.kicker) banner(S.kicker, 38, `left:${PAD + 6}px;top:118px`);
  head(S.lines.map((t, i) => ({ t, size: i ? 132 : 104, y: !!i, max: 640, sw: 5 })), `left:${PAD}px;top:${S.kicker ? 190 : 150}px`, { code: 30 });
  if (S.tag) banner(S.tag, 40, `left:${PAD + 6}px;top:580px`);
  marks();
};
L.ytskins = () => {
  artBg(S.imgs[0], -600, -700, 2400, .38);
  grade(.25, .55);
  const n = S.imgs.length;
  S.imgs.slice().reverse().forEach((src, k) => {
    const i = n - 1 - k, size = i === 0 ? 860 : 640;
    const x = i === 0 ? 1280 - 420 - size / 2 : (i === 1 ? 1280 - 700 - size / 2 : 1280 - 150 - size / 2);
    pic(src, `width:${size}px;height:${size}px;left:${x}px;top:${i === 0 ? 120 : 230}px;filter:${i ? "brightness(.7) " : ""}saturate(.94) drop-shadow(0 20px 30px rgba(0,0,0,.5))`);
  });
  el("fill", "background: linear-gradient(90deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.35) 42%, rgba(0,0,0,0) 62%)");
  grain(.08);
  if (S.kicker) banner(S.kicker, 38, `left:${PAD + 6}px;top:118px`);
  head(S.lines.map((t, i) => ({ t, size: i ? 132 : 104, y: !!i, max: 620, sw: 5 })), `left:${PAD}px;top:${S.kicker ? 190 : 150}px`, { code: 30 });
  if (S.tag) banner(S.tag, 40, `left:${PAD + 6}px;top:580px`);
  marks();
};

window.ready = (async () => {
  L[S.kind]();
  await document.fonts.ready;
  for (const [s, max] of fits) {
    let f = parseFloat(s.style.fontSize);
    while (s.getBoundingClientRect().width > max && f > 30) { f -= 2; s.style.fontSize = f + "px"; }
  }
  await Promise.all([...document.images].map((i) => i.decode().catch(() => { throw new Error("image failed: " + i.src); })));
  return true;
})();
</script>
</body>
</html>

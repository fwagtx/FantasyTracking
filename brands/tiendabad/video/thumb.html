<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- LA TIENDITA BAD covers and thumbnails (auto/thumbs.py writes the spec, thumb.mjs takes the screenshot).
     Owner, 2026-11-18: the frame covers "look so ai"; the first designed ones still gave off "very ai-ish" (sunburst rays,
     white sticker outlines, tilted text, marker-font notes, bordered stickers). So these are built from the game's own look:
     the listing's in-game render on Epic's own tile colours, the shop's name-and-price strip with the V-buck icon, the
     official map with its white map-label lettering, Fortnite's slanted yellow banners. Straight type on a grid, no effects. -->
<style>
  @font-face { font-family: "BC"; font-weight: 900; src: url(../../_shared/fonts/BarlowCondensed-Black.ttf); font-display: block; }
  @font-face { font-family: "BC"; font-weight: 800; src: url(../../_shared/fonts/BarlowCondensed-ExtraBold.ttf); font-display: block; }
  html, body { margin: 0; padding: 0; background: #000; }
  #s { position: relative; overflow: hidden; }
  .fill { position: absolute; inset: 0; }
  img { position: absolute; display: block; }
  /* headline: Fortnite-UI caps, a thin dark edge and a soft shadow, never tilted */
  .h { position: absolute; font-family: "BC"; font-weight: 900; text-transform: uppercase; line-height: .88; color: #fff; letter-spacing: -.005em; }
  .h .l { display: block; width: max-content; -webkit-text-stroke: var(--sw, 7px) rgba(8,8,16,.92); paint-order: stroke fill; text-shadow: 0 6px 22px rgba(0,0,0,.45); }
  .h.c .l { margin: 0 auto; }
  .h.r .l { margin-left: auto; }
  .y { color: #ffe14d; }
  /* Fortnite's slanted banner */
  .ban { position: absolute; transform: skewX(-12deg); background: #ffe14d; padding: 8px 26px 4px; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .ban span { display: block; transform: skewX(12deg); font-family: "BC"; font-weight: 900; text-transform: uppercase; color: #12121a; line-height: 1; white-space: nowrap; }
  .ban.dark { background: #12121a; } .ban.dark span { color: #fff; }
  /* the shop tile's name-and-price strip */
  .strip { position: absolute; left: 0; right: 0; padding: 26px 64px 22px; }
  .strip .n { font-family: "BC"; font-weight: 800; text-transform: uppercase; color: #fff; line-height: 1; white-space: nowrap; width: max-content; }
  .strip .p { display: flex; align-items: center; gap: 18px; margin-top: 14px; font-family: "BC"; font-weight: 900; color: #fff; line-height: 1; }
  .strip .p img { position: static; }
  .strip .p s { color: rgba(255,255,255,.55); text-decoration-thickness: .09em; text-decoration-color: rgba(255,255,255,.75); font-weight: 800; }
  .brand { position: absolute; font-family: "BC"; font-weight: 800; color: rgba(255,255,255,.92); letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.6); white-space: nowrap; }
</style>
</head>
<body>
<div id="s"></div>
<script>
const S = window.SPEC, W = S.w, H = S.h;
const st = document.getElementById("s");
st.style.width = W + "px"; st.style.height = H + "px";
const fits = [];
const PAD = W > H ? 56 : 64;

function el(cls, css, html, parent = st) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  if (css) d.style.cssText = css;
  if (html != null) d.innerHTML = html;
  parent.appendChild(d);
  return d;
}
function pic(src, css, parent = st) {
  const i = document.createElement("img");
  i.src = src; i.style.cssText = css;
  parent.appendChild(i);
  return i;
}
function head(lines, css, align = "") {         // lines: [{t, size, y (yellow), max}]
  const box = el("h" + (align ? " " + align : ""), css);
  for (const L of lines) {
    const s = document.createElement("span");
    s.className = "l" + (L.y ? " y" : ""); s.textContent = L.t; s.style.fontSize = L.size + "px";
    if (L.sw) s.style.setProperty("--sw", L.sw + "px");
    box.appendChild(s);
    if (L.max) fits.push([s, L.max]);
  }
  return box;
}
function banner(text, size, css, kind = "") { return el("ban" + (kind ? " " + kind : ""), css, `<span style="font-size:${size}px">${text}</span>`); }
const hex = (c) => "#" + String(c || "333333ff").slice(0, 6);
const fmt = (n) => Number(n).toLocaleString("en-US");
function marks() {
  if (S.disc === false) return;
  const sz = W > H ? 24 : 34, top = W > H ? 22 : 64;
  el("brand", `left:${PAD}px;top:${top}px;font-size:${sz}px`, "#EpicPartner");
  el("brand", `right:${PAD}px;top:${top}px;font-size:${sz}px`, "LA TIENDITA BAD");
}

// a listing as the game shows it: Epic's tile colours, a soft light behind the item, the in-game render
function tileBg(c) {
  const c1 = hex(c.color1), c2 = c.color2 ? hex(c.color2) : null, c3 = hex(c.color3 || c.color1);
  el("fill", `background: linear-gradient(180deg, ${c1} 0%, ${c2 ? c2 + " 48%," : ""} ${c3} 100%)`);
  el("fill", "background: radial-gradient(ellipse 62% 42% at 50% 52%, rgba(255,255,255,.20) 0%, rgba(255,255,255,0) 70%)");
}
function strip(c, name, price, regular, top, save) {
  const bg = hex(c.textBackgroundColor || c.color3 || "1a1a22ff");
  const s = el("strip", `top:${top}px;bottom:0;background:${bg};box-shadow:0 -6px 24px rgba(0,0,0,.25)`);
  if (save) banner(save, 50, `right:${PAD + 8}px;top:${top + 118}px`);
  const n = el("n", "font-size:64px", name, s);
  fits.push([n, W - 2 * PAD]);
  if (price != null) {
    el("p", "font-size:100px", `<img src="${S.vbuck}" style="width:92px;height:92px">${price}${regular ? ` <s style="font-size:66px;margin-left:10px">${regular}</s>` : ""}`, s);
  }
  return s;
}

const L = {};

L.drop = () => {              // "Se va hoy": the bundle leaving today, as its shop tile
  tileBg(S.colors);
  pic(S.hero, "width:1180px;height:1180px;left:-50px;top:600px;filter:drop-shadow(0 26px 40px rgba(0,0,0,.4))");
  el("fill", "background: linear-gradient(180deg, rgba(0,0,0,.42) 0px, rgba(0,0,0,0) 640px)");
  head([{ t: "SE VA", size: 230 }, { t: "HOY", size: 330, y: true }], `left:${PAD}px;top:236px`);
  banner(S.when, 58, `right:${PAD + 10}px;top:300px`);
  strip(S.colors, S.name, fmt(S.final), S.regular ? fmt(S.regular) : "", 1418);
  marks();
};

L.top = () => {               // the #1 of today's new listings, the price hidden: the video counts it up
  tileBg(S.colors);
  pic(S.hero, "width:1240px;height:1240px;left:-80px;top:470px;filter:drop-shadow(0 26px 40px rgba(0,0,0,.4))");
  el("fill", "background: linear-gradient(180deg, rgba(0,0,0,.45) 0px, rgba(0,0,0,0) 660px)");
  head(S.lines.map((t, i) => ({ t, size: 176, y: i === S.lines.length - 1, max: 700 })), `left:${PAD}px;top:236px`);
  banner("#1", 150, `right:${PAD + 14}px;top:250px;padding:10px 34px 2px`);
  strip(S.colors, S.name, "?????", "", 1418);
  marks();
};

L.shop = () => {              // today's shop: the deal's listing as its tile, the date on a banner
  tileBg(S.colors);
  pic(S.hero, "width:1240px;height:1240px;left:-80px;top:470px;filter:drop-shadow(0 26px 40px rgba(0,0,0,.4))");
  el("fill", "background: linear-gradient(180deg, rgba(0,0,0,.45) 0px, rgba(0,0,0,0) 640px)");
  head([{ t: "TIENDA", size: 220 }, { t: "DE HOY", size: 220, y: true }], `left:${PAD}px;top:236px`);
  banner(S.date, 84, `right:${PAD + 10}px;top:268px`);
  strip(S.colors, S.name, S.final != null ? fmt(S.final) : null, S.regular ? fmt(S.regular) : "", 1418, S.tag);
  marks();
};

L.guess = () => {             // "¿De qué temporada?": the skin on its rarity colours, the season left blank
  tileBg({ color1: S.rarity[0], color3: S.rarity[1] });
  pic(S.hero, "width:1500px;height:1500px;left:-210px;top:440px;filter:drop-shadow(0 26px 40px rgba(0,0,0,.4))");
  el("fill", "background: linear-gradient(180deg, rgba(0,0,0,.45) 0px, rgba(0,0,0,0) 660px)");
  head([{ t: "¿DE QUÉ", size: 190 }, { t: "TEMPORADA?", size: 214, y: true, max: W - 2 * PAD }], `left:${PAD}px;top:236px`);
  banner("3 SKINS · SIN TRAMPA", 52, `left:${PAD + 8}px;top:640px`, "dark");
  const s = strip({ textBackgroundColor: S.rarity[2] }, S.name, null, null, 1418);
  el("p", "font-size:92px", `CAPÍTULO ? · TEMPORADA ?`, s);
  marks();
};

L.map = () => {               // "¿Dónde está?": the official map, the place circled once in red
  const cx = 540, cy = 1130, z = S.z || 2.5, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${cx - S.x * z}px;top:${cy - S.y * z}px;filter:saturate(1.12)`);
  el("fill", "background: linear-gradient(180deg, rgba(6,14,34,.88) 0px, rgba(6,14,34,.7) 520px, rgba(6,14,34,0) 760px)");
  const r = 132;
  el("", `position:absolute;left:${cx - r * 1.12}px;top:${cy - r * .92}px;width:${r * 2.24}px;height:${r * 1.84}px;border:13px solid #ff2a2a;border-radius:50%;transform:rotate(-8deg);box-shadow:0 0 0 2px rgba(0,0,0,.18), inset 0 0 0 2px rgba(0,0,0,.12);box-sizing:border-box`);
  head([{ t: "¿DÓNDE ESTÁ", size: 132 }, ...S.lines.map((t) => ({ t, size: 196, y: true, max: W - 2 * PAD }))], `left:${PAD}px;top:236px`);
  marks();
};

L.guide = () => {             // the countdown: one number over the island
  const z = 1.2, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${540 - S.cx * z}px;top:${980 - S.cy * z}px;filter:saturate(1.1) brightness(.62)`);
  el("fill", "background: linear-gradient(180deg, rgba(6,14,34,.7) 0%, rgba(6,14,34,.25) 45%, rgba(6,14,34,.75) 100%)");
  banner(S.kicker, 70, `left:${PAD + 8}px;top:250px`);
  if (S.top) head([{ t: S.top, size: 170 }], `left:${PAD}px;top:390px`);
  head([{ t: S.big, size: 760, sw: 10, max: W - 2 * PAD }], `left:${PAD - 10}px;top:520px`);
  if (S.bottom) head([{ t: S.bottom, size: 230, y: true }], `left:${PAD}px;top:1200px`);
  if (S.note) head([{ t: S.note, size: 88 }], `left:${PAD}px;top:1450px`);
  marks();
};

L.news = () => {
  const z = 1.1, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${540 - S.cx * z}px;top:${1000 - S.cy * z}px;filter:saturate(1.1) brightness(.6)`);
  el("fill", "background: linear-gradient(180deg, rgba(6,14,34,.75) 0%, rgba(6,14,34,.3) 50%, rgba(6,14,34,.8) 100%)");
  banner(S.kicker, 64, `left:${PAD + 8}px;top:250px`);
  head(S.lines.map((t, i) => ({ t, size: 200, y: i % 2 === 1, max: W - 2 * PAD })), `left:${PAD}px;top:400px`);
  if (S.note) head([{ t: S.note, size: 84, max: W - 2 * PAD }], `left:${PAD}px;top:1450px`);
  marks();
};

// ---------- YouTube (1280x720) ----------
L.ytmap = () => {
  const z = S.z || .62, size = 2048 * z;
  pic(S.map, `width:${size}px;height:${size}px;left:${830 - S.cx * z}px;top:${370 - S.cy * z}px;filter:saturate(1.12)`);
  el("fill", "background: linear-gradient(90deg, rgba(6,14,34,.94) 0%, rgba(6,14,34,.8) 40%, rgba(6,14,34,0) 66%)");
  if (S.big) head([{ t: S.big, size: S.bigSize || 520, sw: 9 }], `right:${S.bigRight ?? 70}px;top:${S.bigTop ?? 40}px`, "r");
  if (S.kicker) banner(S.kicker, 40, `left:${PAD + 6}px;top:118px`);
  head(S.lines.map((t, i) => ({ t, size: i ? 132 : 104, y: !!i, max: 640, sw: 6 })), `left:${PAD}px;top:${S.kicker ? 190 : 150}px`);
  if (S.tag) banner(S.tag, 44, `left:${PAD + 6}px;top:560px`, "dark");
  marks();
};
L.ytskins = () => {
  tileBg({ color1: S.c1 || "2f8cffff", color2: S.c2 || null, color3: S.c3 || "071a52ff" });
  const n = S.imgs.length;
  S.imgs.slice().reverse().forEach((src, k) => {
    const i = n - 1 - k, size = i === 0 ? 860 : 640;
    const x = i === 0 ? 1280 - 420 - size / 2 : (i === 1 ? 1280 - 700 - size / 2 : 1280 - 150 - size / 2);
    pic(src, `width:${size}px;height:${size}px;left:${x}px;top:${i === 0 ? 120 : 230}px;filter:${i ? "brightness(.82) " : ""}drop-shadow(0 20px 30px rgba(0,0,0,.45))`);
  });
  el("fill", "background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 42%, rgba(0,0,0,0) 60%)");
  if (S.kicker) banner(S.kicker, 40, `left:${PAD + 6}px;top:118px`);
  head(S.lines.map((t, i) => ({ t, size: i ? 132 : 104, y: !!i, max: 620, sw: 6 })), `left:${PAD}px;top:${S.kicker ? 190 : 150}px`);
  if (S.tag) banner(S.tag, 44, `left:${PAD + 6}px;top:560px`, "dark");
  marks();
};

window.ready = (async () => {
  L[S.kind]();
  await document.fonts.ready;
  for (const [s, max] of fits) {
    let f = parseFloat(s.style.fontSize);
    while (s.getBoundingClientRect().width > max && f > 30) { f -= 2; s.style.fontSize = f + "px"; }
  }
  await Promise.all([...document.images].map((i) => i.decode().catch(() => { throw new Error("image failed: " + i.src); })));
  return true;
})();
</script>
</body>
</html>
